<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexPOS — Customer Display Console</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons Local -->
    <script src="lib/lucide.min.js"></script>

    <style>
        :root {
            --bg-deep: #080d16;
            --bg-base: #0F172A;
            --bg-elevated: #1e293b;
            --primary: #6366F1;
            --color-success: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-deep);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent 500px),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.08), transparent 500px);
        }

        /* Top Header */
        .display-header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo i {
            color: var(--primary);
            width: 32px;
            height: 32px;
        }

        .brand-logo h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            color: var(--primary);
        }

        .welcome-msg {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Workspace split */
        .display-body {
            flex: 1;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            overflow: hidden;
        }

        /* Left Pane: Items List */
        .items-panel {
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
        }

        .items-panel h2 {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .items-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 8px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            animation: slideIn 0.3s ease;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name {
            font-size: 18px;
            font-weight: 600;
        }

        .item-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        .item-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Right Pane: Invoice Totals & Splash */
        .summary-panel {
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
        }

        .totals-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-row.sub {
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 12px;
            font-size: 15px;
            color: var(--text-muted);
        }

        .total-row.grand {
            font-size: 20px;
            font-weight: 800;
        }

        .total-row.grand h3 {
            color: var(--color-success);
            font-size: 36px;
            margin-top: 4px;
        }

        /* Idle State Display */
        .idle-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .idle-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .idle-logo {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
            animation: pulseGlow 3s infinite;
        }

        .idle-logo i {
            width: 48px;
            height: 48px;
            color: #fff;
        }

        .idle-text {
            text-align: center;
        }

        .idle-text h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .idle-text p {
            color: var(--text-muted);
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(99, 102, 241, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(99, 102, 241, 0.5); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="display-header">
        <div class="brand-logo">
            <i data-lucide="cpu"></i>
            <h1>Apex<span>POS</span></h1>
        </div>
        <div class="welcome-msg" id="header-message">Welcome to our store</div>
    </header>

    <!-- Main Workspace -->
    <div class="display-body">
        <!-- Left: Items list -->
        <section class="items-panel">
            <h2><i data-lucide="shopping-bag" style="width: 18px; height: 18px;"></i> Shopping Cart Items</h2>
            <div class="items-list" id="display-items-list">
                <!-- Loaded dynamically -->
            </div>
        </section>

        <!-- Right: Totals Summary -->
        <section class="summary-panel">
            <div class="totals-card">
                <div class="total-row sub">
                    <span>Subtotal</span>
                    <span id="display-subtotal">LKR 0.00</span>
                </div>
                <div class="total-row sub" style="color: #ef4444;" id="display-discount-row">
                    <span>Discounts Given</span>
                    <span id="display-discount">-LKR 0.00</span>
                </div>
                <div class="total-row grand">
                    <div>
                        <span>Amount Due</span>
                        <h3 id="display-total">LKR 0.00</h3>
                    </div>
                </div>
            </div>

            <div style="font-size: 13px; color: var(--text-muted); text-align: center; border-top: 1px dashed var(--border-color); padding-top: 20px;">
                Thank you for shopping with us!
            </div>
        </section>
    </div>

    <!-- Idle Welcome Screen Overlay -->
    <div class="idle-overlay" id="idle-screen">
        <div class="idle-logo">
            <i data-lucide="cpu"></i>
        </div>
        <div class="idle-text">
            <h2>Welcome to Apex Retail</h2>
            <p>Please place your items at the cashier terminal</p>
        </div>
    </div>

    <script>
        // Check if Electron is available
        let ipcRenderer = null;
        try {
            const electron = require('electron');
            ipcRenderer = electron.ipcRenderer;
        } catch(e) {
            console.warn("Electron IPC not available. Running in demo mode.");
        }

        // Initialize icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        function formatCurrency(amount) {
            return 'LKR ' + parseFloat(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Handle incoming display updates
        if (ipcRenderer) {
            ipcRenderer.on('update-customer-display', (event, data) => {
                const { cart, discount, totals, state } = data;
                
                const idleScreen = document.getElementById('idle-screen');
                const itemsContainer = document.getElementById('display-items-list');
                const headerMsg = document.getElementById('header-message');

                if (state === 'checkout') {
                    headerMsg.textContent = 'Settling Invoice...';
                } else if (state === 'completed') {
                    headerMsg.textContent = 'Transaction Successful!';
                    idleScreen.classList.remove('hidden');
                    const idleH2 = idleScreen.querySelector('h2');
                    const idleP = idleScreen.querySelector('p');
                    idleH2.textContent = 'Invoice Settled!';
                    idleH2.style.color = 'var(--color-success)';
                    idleP.textContent = 'Paid: ' + formatCurrency(totals.grandTotal);
                    
                    // Reset back to idle after 6 seconds
                    setTimeout(() => {
                        idleH2.textContent = 'Welcome to Apex Retail';
                        idleH2.style.color = '';
                        idleP.textContent = 'Please place your items at the cashier terminal';
                    }, 6000);
                    return;
                } else {
                    headerMsg.textContent = 'Welcome to our store';
                }

                if (!cart || cart.length === 0) {
                    // Show idle overlay
                    idleScreen.classList.remove('hidden');
                    itemsContainer.innerHTML = '';
                    return;
                }

                // Hide idle overlay
                idleScreen.classList.add('hidden');

                // Render cart items
                itemsContainer.innerHTML = '';
                cart.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    
                    const itemTotal = item.product.price * item.quantity;
                    
                    row.innerHTML = `
                        <div class="item-details">
                            <span class="item-name">${item.product.name}</span>
                            <span class="item-meta">${item.quantity} x ${formatCurrency(item.product.price)}</span>
                        </div>
                        <span class="item-price">${formatCurrency(itemTotal)}</span>
                    `;
                    itemsContainer.appendChild(row);
                });

                // Update totals
                document.getElementById('display-subtotal').textContent = formatCurrency(totals.subtotal);
                document.getElementById('display-discount').textContent = `- ${formatCurrency(totals.discount)}`;
                document.getElementById('display-total').textContent = formatCurrency(totals.grandTotal);

                // Show/hide discount row
                const discRow = document.getElementById('display-discount-row');
                if (totals.discount > 0) {
                    discRow.style.display = 'flex';
                } else {
                    discRow.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
